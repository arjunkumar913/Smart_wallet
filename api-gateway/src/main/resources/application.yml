server:
  port: ${PORT:8080}       # Render (and most clouds) inject PORT

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # The web app is served from another origin, so the browser needs CORS. Answered here, once, for every service.
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
            allowedMethods: [GET, POST, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, Idempotency-Key]
            exposedHeaders: [Idempotent-Replayed]
            maxAge: 3600
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: wallet-service
          uri: ${WALLET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/wallets/**,/api/transfers/**,/api/topups/**,/api/webhooks/**,/api/admin/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
