server:
  port: ${PORT:8083}       # Render (and most clouds) inject PORT

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USERNAME:smartwallet}
    password: ${DB_PASSWORD:smartwallet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes}
  email:
    # "log" prints each email to the console (no account needed). "brevo" sends real email over Brevo's HTTPS API.
    provider: ${EMAIL_PROVIDER:log}
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@smartwallet.dev}   # with brevo: a sender verified in your Brevo account
    from-name: ${EMAIL_FROM_NAME:Smart Wallet}
    app-url: ${APP_URL:http://localhost:5173}                       # linked from every email
    time-zone: ${EMAIL_TIME_ZONE:Asia/Kolkata}
    skip-domains: ${EMAIL_SKIP_DOMAINS:demo.smartwallet.dev}        # demo accounts have made-up addresses
    brevo:
      api-key: ${BREVO_API_KEY:}
    dispatch:
      enabled: true
      interval-ms: 5000
      batch-size: 20
      max-attempts: 6               # then the email is marked FAILED; the in-app notification is unaffected
      first-retry-seconds: 30       # 30s, 1m, 2m, 4m, 8m between attempts
      lease-seconds: 120            # a claimed email whose sender crashed is picked up again after this

management:
  endpoints:
    web:
      exposure:
        include: health
