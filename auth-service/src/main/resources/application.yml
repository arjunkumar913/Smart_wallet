server:
  port: ${PORT:8081}       # Render (and most clouds) inject PORT

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:smartwallet}
    password: ${DB_PASSWORD:smartwallet}
  jpa:
    hibernate:
      ddl-auto: validate        # Liquibase owns the schema
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes}
    expiration-minutes: 60
  admin:
    email: ${ADMIN_EMAIL:}            # empty = no admin bootstrap; set it per environment
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
      # The website pings /actuator/health on every service directly to wake them all at once (free hosting
      # puts idle services to sleep). Health only says UP or DOWN, so any origin may read it, GET only.
      cors:
        allowed-origin-patterns: "*"
        allowed-methods: GET
