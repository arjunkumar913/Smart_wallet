server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:smartwallet}
    password: ${DB_PASSWORD:smartwallet}
  jpa:
    hibernate:
      ddl-auto: validate        # Liquibase owns the schema
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes}
    expiration-minutes: 60
  admin:
    email: ${ADMIN_EMAIL:admin@smartwallet.dev}
    password: ${ADMIN_PASSWORD:Admin@12345}

management:
  endpoints:
    web:
      exposure:
        include: health
