# Render Blueprint: deploys all four services as free Docker web services, plus the React frontend as a static site.
# Secrets marked "sync: false" are NOT stored in git; Render asks for them in the dashboard.
#   Databases: Neon (free Postgres)   ·   Broker: CloudAMQP (free RabbitMQ)
# See DEPLOYMENT.md for the step-by-step setup.

envVarGroups:
  - name: smartwallet-shared
    envVars:
      # One random secret, generated once by Render and shared, so every service trusts the same JWTs
      - key: JWT_SECRET
        generateValue: true
      # Keep connection usage small: Neon free plan + 3 services
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"

services:
  - type: web
    name: smartwallet-auth
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./deploy/auth-service.Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: smartwallet-shared
      - key: DB_URL                      # jdbc:postgresql://<neon-host>/auth_db?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_RABBITMQ_ADDRESSES   # amqps://user:pass@host/vhost from CloudAMQP
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: smartwallet-wallet
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./deploy/wallet-service.Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: smartwallet-shared
      - key: DB_URL                      # jdbc:postgresql://<neon-host>/wallet_db?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      # "mock" = built-in demo bank (no account needed). "razorpay" = Razorpay checkout; then the three keys below are required.
      - key: PAYMENT_PROVIDER
        value: mock
      - key: RAZORPAY_KEY_ID             # rzp_test_... (public)
        sync: false
      - key: RAZORPAY_KEY_SECRET         # secret: only ever set here, never in git
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET     # the secret typed into Razorpay's webhook settings
        sync: false

  - type: web
    name: smartwallet-notification
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./deploy/notification-service.Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: smartwallet-shared
      - key: DB_URL                      # jdbc:postgresql://<neon-host>/notification_db?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false

  - type: web
    name: smartwallet-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./deploy/api-gateway.Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Public URLs of the three services, e.g. https://smartwallet-auth.onrender.com (filled in after first deploy)
      - key: AUTH_SERVICE_URL
        sync: false
      - key: WALLET_SERVICE_URL
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        sync: false
      # The frontend's public URL, e.g. https://smartwallet-web.onrender.com (browsers on other sites are refused)
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # React frontend, built by Vite and served as static files
  - type: web
    name: smartwallet-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # The gateway's public URL, e.g. https://smartwallet-gateway.onrender.com (read at build time)
      - key: VITE_API_URL
        sync: false
