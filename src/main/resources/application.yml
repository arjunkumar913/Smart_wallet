spring:
  application:
    name: smart-wallet

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartwallet}
    username: ${DB_USERNAME:smartwallet}
    password: ${DB_PASSWORD:smartwallet}

  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Liquibase
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes}
    expiration-minutes: 60
  transfer:
    max-amount: 100000.00       # per-transfer limit
  messaging:
    exchange: wallet.events
    notification-queue: notifications.queue
    dead-letter-queue: notifications.dlq
    routing-key: transfer.completed

springdoc:
  swagger-ui:
    path: /swagger-ui.html
