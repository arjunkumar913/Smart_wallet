server:
  port: ${PORT:8082}       # Render (and most clouds) inject PORT

spring:
  application:
    name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${DB_USERNAME:smartwallet}
    password: ${DB_PASSWORD:smartwallet}
  jpa:
    hibernate:
      ddl-auto: validate        # Liquibase owns the schema
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        default-requeue-rejected: false   # after retries, reject -> dead-letter queue (no infinite loop)
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-32-bytes}
  wallet:
    max-top-up: 50000.00
    max-transfer: 100000.00

management:
  endpoints:
    web:
      exposure:
        include: health
